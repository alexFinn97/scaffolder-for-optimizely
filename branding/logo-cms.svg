<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Scaffolder for Optimizely</title>
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="118" y2="0">
      <stop offset="0" stop-color="#9E0B2C"/>
      <stop offset="0.5" stop-color="#E4252C"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#050B24"/>
  <!-- A page with a folded corner, slanted like the publisher mark. -->
  <path d="M40 22H86L100 36L93.3 106H32Z" fill="none" stroke="url(#brand)" stroke-width="7" stroke-linejoin="miter"/>
  <path d="M86 22V36H100" fill="none" stroke="url(#brand)" stroke-width="5"/>
  <!-- Its content: a heading and two lines, as planks. -->
  <g fill="url(#brand)">
    <path d="M48.9 44H86.7L85.8 54H48Z"/>
    <path d="M47 64H80L79 74H46Z"/>
    <path d="M45.1 84H70L69 94H44.1Z"/>
