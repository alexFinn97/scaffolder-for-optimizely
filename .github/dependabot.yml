version: 2

# src/nuget.config lists the Optimizely feed too; declaring it here makes sure Dependabot can
# resolve the EPiServer.* packages.
registries:
  optimizely:
    type: nuget-feed
    url: https://api.nuget.optimizely.com/v3/index.json

updates:
  # One entry for every NuGet project. Dependabot follows project references (the test projects
  # reference ScaffolderForOptimizely.Core), so separate entries would update the same package in
  # different pull requests to different versions. One entry updates every copy together.
  - package-ecosystem: nuget
    directories:
      - /src/ScaffolderForOptimizely.Core
      - /src/ScaffolderForOptimizely.Vsix
      - /src/ScaffolderForOptimizely.Commerce.Vsix
      - /src/ScaffolderForOptimizely.Core.Tests
      - /src/ScaffolderForOptimizely.Compile.Tests
    registries: "*"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    assignees:
      - alexFinn97
    ignore:
      # Match what the oldest supported Visual Studio loads, so they're never bumped.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.VisualStudio.LanguageServices
      - dependency-name: Newtonsoft.Json
      - dependency-name: Community.VisualStudio.Toolkit.17
      # Compile-only security pin in the VSIX projects; stays on 2.x, the major Visual Studio loads.
      - dependency-name: MessagePack
        update-types:
          - version-update:semver-major
      # Taken on deliberately, with an install test, not through a grouped update.
      - dependency-name: Microsoft.VSSDK.BuildTools
        update-types:
          - version-update:semver-major
      # Compile.Tests compiles generated code against CMS 12 and Commerce 14.
      - dependency-name: "EPiServer.*"
        update-types:
          - version-update:semver-major
      # Security pins. 11.0 and later don't support net8.0, which the test projects target.
      - dependency-name: System.Text.Json
        update-types:
          - version-update:semver-major
      - dependency-name: System.Security.Cryptography.Pkcs
        update-types:
          - version-update:semver-major
      - dependency-name: System.Net.Http
        update-types:
          - version-update:semver-major
      - dependency-name: System.Text.RegularExpressions
        update-types:
          - version-update:semver-major
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    assignees:
      - alexFinn97
    groups:
      actions:
        patterns:
          - "*"
