version: 2

# src/nuget.config lists the Optimizely feed too; declaring it here makes sure Dependabot can
# resolve the EPiServer.* packages.
registries:
  optimizely:
    type: nuget-feed
    url: https://api.nuget.optimizely.com/v3/index.json

updates:
  # Shipped projects. Roslyn, Newtonsoft.Json and the VS toolkit match what the oldest supported
  # Visual Studio loads, so they're never bumped. MessagePack is a compile-only security pin that
  # stays on 2.x, the major Visual Studio loads. VSSDK.BuildTools majors are taken on deliberately,
  # with an install test, not through a grouped update.
  - package-ecosystem: nuget
    directories:
      - /src/ScaffolderForOptimizely.Core
      - /src/ScaffolderForOptimizely.Vsix
      - /src/ScaffolderForOptimizely.Commerce.Vsix
    registries: "*"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    assignees:
      - alexFinn97
    ignore:
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.VisualStudio.LanguageServices
      - dependency-name: Newtonsoft.Json
      - dependency-name: Community.VisualStudio.Toolkit.17
      - dependency-name: MessagePack
        update-types:
          - version-update:semver-major
      - dependency-name: Microsoft.VSSDK.BuildTools
        update-types:
          - version-update:semver-major
    groups:
      nuget-shipped:
        patterns:
          - "*"

  # Test projects. Dependabot follows their project reference into ScaffolderForOptimizely.Core and
  # updates it too, so the Visual Studio set is ignored here as well. Compile.Tests compiles generated
  # code against CMS 12 and Commerce 14, so no EPiServer majors. The System.* packages are security
  # pins that must stay on the net8.0 runtime's major.
  - package-ecosystem: nuget
    directories:
      - /src/ScaffolderForOptimizely.Core.Tests
      - /src/ScaffolderForOptimizely.Compile.Tests
    registries: "*"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    assignees:
      - alexFinn97
    ignore:
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.VisualStudio.LanguageServices
      - dependency-name: Newtonsoft.Json
      - dependency-name: Community.VisualStudio.Toolkit.17
      - dependency-name: "EPiServer.*"
        update-types:
          - version-update:semver-major
      - dependency-name: System.Text.Json
        update-types:
          - version-update:semver-major
      - dependency-name: System.Security.Cryptography.Pkcs
        update-types:
          - version-update:semver-major
      - dependency-name: System.Net.Http
        update-types:
          - version-update:semver-major
      - dependency-name: System.Text.RegularExpressions
        update-types:
          - version-update:semver-major
    groups:
      nuget-tests:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    assignees:
      - alexFinn97
    groups:
      actions:
        patterns:
          - "*"
