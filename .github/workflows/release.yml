name: Release

# Push a tag matching src/Directory.Build.props, with or without a "v": `git flow release finish`
# tags 1.0.0 by default, `git tag v1.0.0` works too. Push only one of the two for a release.
# Builds and tests, creates a GitHub release with both .vsix files, then publishes both to the
# Visual Studio Marketplace when the VS_MARKETPLACE_PAT secret is set (see docs/publishing.md).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DiffEngine_Disabled: true
      VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("${{ github.ref_name }}".TrimStart('v') -ne $version) {
            throw "Tag ${{ github.ref_name }} doesn't match <Version>$version</Version> in src/Directory.Build.props."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Also checks every version number, the add-on's dependency range and the changelog agree.
      - name: Unit, snapshot and release tests
        run: dotnet test src/ScaffolderForOptimizely.Core.Tests -c Release

      - name: Compile tests (generated code vs Optimizely CMS 12 and Commerce 14)
        run: dotnet test src/ScaffolderForOptimizely.Compile.Tests -c Release

      - uses: microsoft/setup-msbuild@v2

      # Building the Commerce add-on builds the main extension first.
      - name: Build VSIXs
        run: msbuild src/ScaffolderForOptimizely.Commerce.Vsix/ScaffolderForOptimizely.Commerce.Vsix.csproj /restore /p:Configuration=Release /v:minimal

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          # Release notes: this version's section of CHANGELOG.md.
          $changelog = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $match.Success) { throw "CHANGELOG.md has no '## [$version]' section." }
          Set-Content release-notes.md $match.Groups[1].Value.Trim()

          # 0.x releases are marked as pre-releases, like the Marketplace's Preview badge.
          # A plain variable, not an @splat: splatting "--prerelease" to a native command mangles it.
          $prerelease = if ($version.StartsWith("0.")) { "--prerelease" } else { "--prerelease=false" }
          gh release create "${{ github.ref_name }}" `
            src/ScaffolderForOptimizely.Vsix/bin/Release/ScaffolderForOptimizely.vsix `
            src/ScaffolderForOptimizely.Commerce.Vsix/bin/Release/ScaffolderForOptimizely.Commerce.vsix `
            --title "Scaffolder for Optimizely $version" --notes-file release-notes.md $prerelease
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed." }

      - name: Publish to the Visual Studio Marketplace
        if: env.VS_MARKETPLACE_PAT != ''
        shell: pwsh
        run: |
          foreach ($manifest in Get-ChildItem marketplace/*.json) {
            if ((Get-Content $manifest -Raw) -match 'YOUR-PUBLISHER-ID') {
              throw "Set your Marketplace publisher ID in $($manifest.Name) (see docs/publishing.md)."
            }
          }

          # VsixPublisher ships in the Microsoft.VSSDK.BuildTools package restored by the build.
          $publisher = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.vssdk.buildtools\*\tools\vssdk\bin\VsixPublisher.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $publisher) { throw "VsixPublisher.exe wasn't found in the NuGet cache." }

          # The main extension first: the add-on depends on it.
          $packages = @(
            @{ Payload = "src/ScaffolderForOptimizely.Vsix/bin/Release/ScaffolderForOptimizely.vsix"; Manifest = "marketplace/scaffolder-for-optimizely.json" },
            @{ Payload = "src/ScaffolderForOptimizely.Commerce.Vsix/bin/Release/ScaffolderForOptimizely.Commerce.vsix"; Manifest = "marketplace/scaffolder-for-optimizely-commerce.json" }
          )
          foreach ($package in $packages) {
            $output = & $publisher.FullName publish -payload $package.Payload -publishManifest $package.Manifest -personalAccessToken $env:VS_MARKETPLACE_PAT 2>&1 | Out-String
            Write-Host $output
            # Judge by the output, not the exit code: VsixPublisher's own telemetry can crash with an
            # unhandled exception (an assembly version mismatch inside the tool) and exit non-zero
            # after a successful upload. VsixPub0038 is its "Uploaded ... to the marketplace" message.
            if ($output -notmatch 'VsixPub0038') { throw "Publishing $($package.Payload) failed." }
          }

          # Both uploads succeeded. Actions fails a pwsh step whose last program exited non-zero,
          # which VsixPublisher's telemetry crash still causes, so finish explicitly.
          exit 0

      - name: Marketplace publishing skipped
        if: env.VS_MARKETPLACE_PAT == ''
        shell: pwsh
        run: Write-Host "::notice::No VS_MARKETPLACE_PAT secret, so nothing was published. Upload the .vsix files from the GitHub release at marketplace.visualstudio.com/manage, or see docs/publishing.md."
